name: Decrypt NM File

on:
  workflow_dispatch:
  push:
    paths:
      - '*.nm'
      - '*.NM'

jobs:
  decrypt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone decrypt script
        run: git clone https://github.com/noobconner21/Netmod-Syna-Decrypt-Script.git

      - name: Install dependencies
        run: pip install pycryptodome

      - name: Copy your .nm file into script folder
        run: |
          shopt -s nocaseglob
          find . -maxdepth 1 -iname "*.nm" -exec cp {} Netmod-Syna-Decrypt-Script/ \;
          ls -la Netmod-Syna-Decrypt-Script/

      - name: Run decrypt script
        working-directory: Netmod-Syna-Decrypt-Script
        run: python nm.py

      - name: Upload decrypted output
        uses: actions/upload-artifact@v4
        with:
          name: decrypted-output
          path: |
            Netmod-Syna-Decrypt-Script/*.txt
