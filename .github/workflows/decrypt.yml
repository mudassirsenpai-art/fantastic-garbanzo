name: Decrypt NM File

on:
  workflow_dispatch:
  push:
    paths:
      - '*.nm'
      - '*.NM'

jobs:
  decrypt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone decrypt script
        run: git clone https://github.com/noobconner21/Netmod-Syna-Decrypt-Script.git

      - name: Install dependencies
        run: pip install pycryptodome

      - name: Copy your .nm file into script folder
        run: |
          shopt -s nocaseglob
          mkdir -p Netmod-Syna-Decrypt-Script/Download
          mkdir -p "$HOME/storage/downloads" 2>/dev/null || true
          for f in *.nm *.NM; do
            [ -e "$f" ] || continue
            cp "$f" Netmod-Syna-Decrypt-Script/
            cp "$f" Netmod-Syna-Decrypt-Script/Download/
          done
          ls -la Netmod-Syna-Decrypt-Script/

      - name: Run decrypt script
        working-directory: Netmod-Syna-Decrypt-Script
        run: python nm.py

      - name: Inspect script for expected path
        if: failure()
        working-directory: Netmod-Syna-Decrypt-Script
        run: |
          python3 - <<'EOF'
          import re, marshal, types
          src = open('nm.py', 'rb').read()
          m = re.search(rb"loads\((b'.*?')\)\s*$", src, re.S)
          blob = eval(m.group(1))
          code = marshal.loads(blob)
          def walk(c, depth=0):
              print("  "*depth + f"code: {c.co_name}")
              for const in c.co_consts:
                  if isinstance(const, str) and len(const) < 200:
                      print("  "*(depth+1) + f"str: {const!r}")
                  if isinstance(const, types.CodeType):
                      walk(const, depth+1)
          walk(code)
          EOF

      - name: Upload decrypted output
        uses: actions/upload-artifact@v4
        with:
          name: decrypted-output
          path: |
            Netmod-Syna-Decrypt-Script/*.txt
          retention-days: 1
